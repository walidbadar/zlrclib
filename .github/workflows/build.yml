name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: zlrclib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: zlrclib
          toolchains: xtensa-espressif_esp32_zephyr-elf:xtensa-espressif_esp32s3_zephyr-elf

      - name: Build firmware
        working-directory: zlrclib
        shell: bash
        run: |
          west blobs fetch hal_espressif

          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_TWISTER_FLAGS="--short-build-path"
          fi

          west twister -T app \
            -O twister-out-build \
            -v --inline-logs --integration -W \
            --board-root $(pwd)/boards \
            $EXTRA_TWISTER_FLAGS
